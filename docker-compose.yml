# CooldownWatch Docker Services
#
# Usage:
#   docker compose run --rm luacheck                    # Run lua linting
#   docker compose run --rm luacheck-report             # Generate lua lint report
#   docker compose run --rm busted                      # Run headless tests
#   docker compose run --rm busted-report               # Generate busted test report

services:
  luacheck:
    image: ragedunicorn/luacheck:1.2.0-alpine3.24.1-1
    container_name: cooldown-watch-luacheck
    volumes:
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["."]
  luacheck-report:
    image: ragedunicorn/luacheck:1.2.0-alpine3.24.1-1
    container_name: cooldown-watch-luacheck-report
    volumes:
      - ./:/workspace:ro
      - ./target:/reports
    working_dir: /workspace
    entrypoint: /bin/sh
    command: ["-c", "luacheck --formatter JUnit . > /reports/luacheck-junit.xml"]
  busted-report:
    image: ragedunicorn/busted:2.3.0-alpine3.24.1-1
    container_name: cooldown-watch-busted-report
    volumes:
      - ./:/workspace:ro
      - ./target:/reports
    working_dir: /workspace
    entrypoint: /bin/sh
    command: ["-c", "busted --output=junit . > /reports/busted-junit.xml"]
  busted:
    image: ragedunicorn/busted:2.3.0-alpine3.24.1-1
    container_name: cooldown-watch-busted
    volumes:
      - ./:/workspace:ro
    working_dir: /workspace
    command: ["."]
